#version: "3.8"
services:
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:15
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - exploracion2030_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: morchellappdb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    depends_on:
      - minio
      - postgres
    ports:
      - "5001:5001"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_REGION=us-east-1
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_PG_DB=morchellappdb
      - MLFLOW_PG_USER=mlflow
      - MLFLOW_PG_PASSWORD=mlflowpass
      - MLFLOW_TRACKING_URI=http://mlflow:5001
    command:
      - "mlflow"
      - "server"
      - "--backend-store-uri"
      - "postgresql://mlflow:mlflowpass@postgres:5432/morchellappdb"
      - "--default-artifact-root"
      - "s3://mlflow/"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "5001"
      - "--allowed-hosts"
      - "0.0.0.0:5001,localhost:5001,127.0.0.1:5001,mlflow:5001,mlflow"
      - "--cors-allowed-origins"
      - "*"
    volumes:
      - ./mlflow-data:/mlflow

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - postgres
      - mlflow
      - minio
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_TRACKING_URI=http://mlflow:5001
    volumes:
      - ./src/dataset:/app/src/dataset

volumes:
  exploracion2030_pgdata:
    driver: local
  minio-data:
  mlflow-data: