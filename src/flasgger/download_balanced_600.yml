Descarga dataset balanceado 600-400
---
tags:
  - Dataset Management
summary: Descarga dataset balanceado con 600 imágenes Morchella y 400 No-Morchella
description: |
  Purga el dataset existente y descarga un conjunto balanceado de imágenes desde iNaturalist:
  
  **Morchella (600 imágenes):**
  - Morchella esculenta: 100
  - Morchella tridentina: 100
  - Morchella andinensis: 25
  - Morchella aysenina: 6
  - Morchella spp (sin ID específico): 369
  
  **No-Morchella (400 imágenes):**
  - Gyromitra esculenta: 80
  - Gyromitra antarctica: 70
  - Helvella lacunosa: 60
  - Helvella crispa: 50
  - Verpa bohemica: 50
  - Cortinarius: 30
  - Laccaria: 30
  - Clitocybe: 30

responses:
  200:
    description: Dataset descargado exitosamente
    schema:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Dataset balanceado 600-400 descargado"
        statistics:
          type: object
          properties:
            morchella:
              type: object
              properties:
                downloaded:
                  type: integer
                  example: 597
                failed:
                  type: integer
                  example: 3
            no_morchella:
              type: object
              properties:
                downloaded:
                  type: integer
                  example: 395
                failed:
                  type: integer
                  example: 5
            total:
              type: integer
              example: 992
  500:
    description: Error durante la descarga
    schema:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          example: "Error descargando dataset: Connection timeout"
