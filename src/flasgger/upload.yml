/upload/model:
  post:
    tags:
      - upload
    summary: Subir un modelo Keras (.h5)
    consumes:
      - multipart/form-data
    parameters:
      - name: model
        in: formData
        type: file
        required: true
        description: Archivo .h5 del modelo
    responses:
      "201":
        description: Modelo subido correctamente
      "400":
        description: Archivo no enviado

/upload/models:
  get:
    tags:
      - upload
    summary: Listar modelos subidos
    responses:
      "200":
        description: Lista de modelos

/upload/activate:
  post:
    tags:
      - upload
    summary: Activar un modelo subido
    consumes:
      - application/json
    parameters:
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            filename:
              type: string
    responses:
      "200":
        description: Modelo activado
      "400":
        description: Payload inválido
      "404":
        description: Modelo no encontrado

/upload/active:
  get:
    tags:
      - upload
    summary: Obtener modelo activo actual
    responses:
      "200":
        description: Información del modelo activo