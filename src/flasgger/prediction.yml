---
post:
  tags:
    - Consumo de modelo
  summary: Clasificar imagen de hongo (Morchella vs No Morchella)
  description: >
    Este endpoint recibe una imagen y predice si es un hongo del género Morchella.
  consumes:
    - multipart/form-data
  parameters:
    - name: imagen
      in: formData
      description: Imagen del hongo a clasificar (formato JPG o PNG)
      required: true
      type: file
  responses:
    200:
      description: Resultado de la predicción
      schema:
        type: object
        properties:
          model_source:
            type: string
          prediction:
            type: string
          confidence:
            type: number
    400:
      description: Imagen no enviada o inválida
    500:
      description: Error interno en el servidor
