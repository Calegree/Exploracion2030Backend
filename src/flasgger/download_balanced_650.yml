Endpoint para descargar dataset balanceado 650-650
---
tags:
  - Dataset Download
summary: "Descarga dataset balanceado: 650 Morchella + 650 No-Morchella con alta diversidad"
description: |
  Descarga un dataset balanceado con especies específicas de Morchella y alta diversidad de hongos no-Morchella.
  
  **Composición Morchella (650 fotos):**
  - 25 fotos de Morchella andinensis
  - 6 fotos de Morchella aysenina
  - 100 fotos de Morchella tridentina
  - 100 fotos de Morchella esculenta
  - 419 fotos de Morchella spp (sin ID específico)
  
  **Composición No-Morchella (650 fotos) - 5 grupos diversos:**
  
  1. **Ascomicetes (330 fotos):**
     - Gyromitra esculenta (90)
     - Gyromitra antarctica (70)
     - Helvella lacunosa (60)
     - Helvella crispa (60)
     - Verpa bohemica (50)
  
  2. **Agaricales comunes (160 fotos):**
     - Amanita muscaria (50)
     - Amanita phalloides (40)
     - Agaricus campestris (40)
     - Agaricus bisporus (30)
  
  3. **Hongos de bosque patagónico (90 fotos):**
     - Boletus edulis (40)
     - Suillus luteus (30)
     - Lactarius deliciosus (20)
  
  4. **Políporos y hongos de madera (40 fotos):**
     - Trametes versicolor (15)
     - Ganoderma lucidum (13)
     - Fomes fomentarius (12)
  
  5. **Gasteroides y otras formas (30 fotos):**
     - Lycoperdon perlatum (12)
     - Calvatia gigantea (10)
     - Phallus impudicus (8)
  
  **⚠️ ADVERTENCIA:** Este endpoint sobrescribe completamente la carpeta `src/dataset/`.
  
  Las imágenes se obtienen de iNaturalist con calidad "research grade" y se guardan en:
  - `src/dataset/morchella/`
  - `src/dataset/no_morchella/`

